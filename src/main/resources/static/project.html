<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body
        {
            margin: auto;
            background-color: black;
            color: aliceblue;
        }
        form
        {
            border: aliceblue solid;
            padding: 10px;
            margin-bottom: 10px;
        }
        #result
        {
            border: aliceblue solid;
            padding: 10px;
            margin-top: 10px;
            min-height: 50px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Rest API</h1>
<form id="insertForm">
    <h2>Insert</h2>
    <label>Key</label>
    <br>
    <input type="text" id="key" name="key" required>
    <br>
    <label>Value</label>
    <br>
    <input type="text" id="value" name="value" required>
    <br>
    <br>
    <input type="submit" value="Insert Key">
</form>
<form id="findForm">
    <h2>Find Key</h2>
    <label>Key</label>
    <br>
    <input type="text" id="keySearch" name="keySearch" required>
    <br>
    <br>
    <input type="submit" value="Search">
</form>
<form id="updateForm">
    <h2>Update</h2>
    <label>Key</label>
    <br>
    <input type="text" id="updateKey" name="updateKey" required>
    <br>
    <label>New Value</label>
    <br>
    <input type="text" id="updateValue" name="updateValue" required>
    <br>
    <br>
    <input type="submit" value="Update Key">
</form>
<form id="deleteForm">
    <h2>Delete</h2>
    <label>Key</label>
    <br>
    <input type="text" id="deleteKey" name="deleteKey" required>
    <br>
    <br>
    <input type="submit" value="Delete Key">
</form>
<button id="listKeysBtn">List All Keys</button>
<div id="result">Result will appear here...</div>
<script>
    //just a shortcut so you dont have to type /api all the time
    const BASE = '/api';
    //so you dont need to type document.getElementById, you can just use resultDiv
    const resultDiv = document.getElementById('result');

    function showResult(data, ok) {
        resultDiv.style.color = ok ? 'lightgreen' : 'tomato';
        resultDiv.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    document.getElementById('insertForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = document.getElementById('key').value;
        const value = document.getElementById('value').value;
        try {
            const res = await fetch(`${BASE}/documents`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, value })
            });
            if (res.ok) showResult('Inserted successfully', true);
            else showResult(`Insert failed: ${res.status}`, false);
        } catch (err) {
            showResult(`Error: ${err.message}`, false);
        }
    });

    document.getElementById('findForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = document.getElementById('keySearch').value;
        try {
            const res = await fetch(`${BASE}/documents/${encodeURIComponent(key)}`);
            if (res.ok) {
                const data = await res.json();
                showResult(data, true);
            } else if (res.status === 404) {
                showResult('Key not found', false);
            } else {
                showResult(`Find failed: ${res.status}`, false);
            }
        } catch (err) {
            showResult(`Error: ${err.message}`, false);
        }
    });

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = document.getElementById('updateKey').value;
        const value = document.getElementById('updateValue').value;
        try {
            const res = await fetch(`${BASE}/documents/${encodeURIComponent(key)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, value })
            });
            if (res.ok) showResult('Updated successfully', true);
            else showResult(`Update failed: ${res.status}`, false);
        } catch (err) {
            showResult(`Error: ${err.message}`, false);
        }
    });o

    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const key = document.getElementById('deleteKey').value;
        try {
            const res = await fetch(`${BASE}/documents/${encodeURIComponent(key)}`, {
                method: 'DELETE'
            });
            if (res.ok) showResult('Deleted successfully', true);
            else showResult(`Delete failed: ${res.status}`, false);
        } catch (err) {
            showResult(`Error: ${err.message}`, false);
        }
    });

    document.getElementById('listKeysBtn').addEventListener('click', async () => {
        try {
            const res = await fetch(`${BASE}/keys`);
            if (res.ok) {
                const keys = await res.json();
                showResult(keys.length ? keys : 'No keys found', true);
            } else {
                showResult(`List keys failed: ${res.status}`, false);
            }
        } catch (err) {
            showResult(`Error: ${err.message}`, false);
        }
    });
</script>
</body>
</html>
