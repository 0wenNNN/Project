<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        #chat { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 12px; margin-bottom: 12px; border-radius: 6px; background: #fafafa; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
        .user { background: #dbeafe; text-align: right; }
        .ai { background: #e5e7eb; }
        .error { background: #fee2e2; color: #b91c1c; }
        #input { width: calc(100% - 80px); padding: 8px; }
        #send { width: 70px; padding: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Database Chat</h1>
    <div id="chat"></div>
    <input id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
    <button id="send" onclick="send()">Send</button>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const msg = input.value.trim();
            if (!msg) return;
            addMsg(msg, 'user');
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });

            if (res.ok) {
                const data = await res.json();
                addMsg(data.response, 'ai');
            } else {
                addMsg('Error: ' + res.status, 'error');
            }
        }
    </script>
</body>
</html>
